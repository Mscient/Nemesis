services:
  - type: web
    name: hackathon-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: USE_MOCK_AI
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:////data/db.sqlite3"
