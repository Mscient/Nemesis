services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackathon_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "sqlite:////data/db.sqlite3"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - sqlite_data:/data
    networks:
      - app_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackathon_frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # anonymous volume so container node_modules win
    networks:
      - app_net
    depends_on:
      - backend

volumes:
  sqlite_data:

networks:
  app_net:
    driver: bridge
